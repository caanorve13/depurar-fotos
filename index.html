<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Depurar fotos</title>
<style>
  :root { --bg:#111; --card:#1d1d1f; --fg:#f5f5f7; --mut:#8e8e93; --del:#ff453a; --keep:#30d158; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  .screen { display:none; height:100%; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); flex-direction:column; }
  .screen.on { display:flex; }
  h1 { font-size:26px; margin:24px 0 8px; }
  p { color:var(--mut); }
  button, input { font:inherit; }
  .btn { background:var(--fg); color:#000; border:0; border-radius:14px; padding:14px 18px; font-weight:600; width:100%; margin-top:12px; }
  .btn.ghost { background:#2c2c2e; color:var(--fg); }
  input { width:100%; padding:12px; border-radius:12px; border:1px solid #333; background:var(--card); color:var(--fg); }
  .center { margin:auto 0; }
  /* swipe */
  #top { display:flex; justify-content:space-between; align-items:center; padding:12px 0; color:var(--mut); font-size:14px; }
  #stage { position:relative; flex:1; min-height:0; }
  .card { position:absolute; inset:0; border-radius:22px; overflow:hidden; background:var(--card);
    touch-action:none; user-select:none; will-change:transform; box-shadow:0 8px 30px #0008; }
  .card img { width:100%; height:100%; object-fit:contain; pointer-events:none; background:#000; }
  .card.next { transform:scale(.95); opacity:.6; }
  .tag { position:absolute; top:24px; padding:6px 14px; border:3px solid; border-radius:10px; font-weight:800; font-size:24px; opacity:0; }
  .tag.del { right:20px; color:var(--del); border-color:var(--del); transform:rotate(12deg); }
  .tag.keep { left:20px; color:var(--keep); border-color:var(--keep); transform:rotate(-12deg); }
  .name { position:absolute; left:0; right:0; bottom:0; padding:28px 14px 12px; font-size:13px; color:#fffc;
    background:linear-gradient(transparent,#000a); }
  #bar { display:flex; gap:12px; padding:14px 0; }
  #bar button { flex:1; border:0; border-radius:50px; padding:16px; font-size:18px; font-weight:700; }
  #bar .d { background:#3a1512; color:var(--del); } #bar .k { background:#0f2e18; color:var(--keep); }
  #bar .u { flex:0 0 56px; background:#2c2c2e; color:var(--fg); }
  /* lista */
  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; overflow:auto; flex:1; margin-top:12px; }
  #grid figure { margin:0; position:relative; }
  #grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; }
  #grid figcaption { font-size:10px; color:var(--mut); word-break:break-all; margin-top:2px; }
  #msg { color:var(--mut); font-size:14px; min-height:20px; }
</style>
</head>
<body>

<!-- 1. Inicio -->
<section id="s-home" class="screen on">
  <div class="center">
    <h1>Depurar fotos</h1>
    <p>Elige un lote de tu Google Fotos, desliza <b style="color:var(--del)">← izquierda</b> para marcar y <b style="color:var(--keep)">derecha →</b> para conservar. Al final te muestro las marcadas para borrarlas.</p>
    <input id="cid" placeholder="Client ID de Google (solo la primera vez)" autocomplete="off">
    <button class="btn" id="go">Elegir fotos de Google Fotos</button>
    <button class="btn ghost" id="resume" style="display:none">Ver lista de marcadas</button>
    <p id="msg"></p>
  </div>
</section>

<!-- 2. Swipe -->
<section id="s-swipe" class="screen">
  <div id="top"><span id="count"></span><span id="marked"></span></div>
  <div id="stage"></div>
  <div id="bar">
    <button class="d" id="bDel">✕ Borrar</button>
    <button class="u" id="bUndo">↩︎</button>
    <button class="k" id="bKeep">✓ Dejar</button>
  </div>
</section>

<!-- 3. Resultado -->
<section id="s-done" class="screen">
  <h1 id="doneTitle">Listo</h1>
  <p>Estas son las que marcaste para borrar. Ábrelas en Google Fotos (busca por nombre de archivo) y bórralas; o toca “Copiar nombres”.</p>
  <button class="btn" id="copy">Copiar nombres de archivo</button>
  <button class="btn ghost" id="openPhotos">Abrir Google Fotos</button>
  <div id="grid"></div>
  <button class="btn ghost" id="again">Elegir otro lote</button>
</section>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const SCOPE = 'https://www.googleapis.com/auth/photospicker.mediaitems.readonly';
const API = 'https://photospicker.googleapis.com/v1';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let token = null, items = [], idx = 0, history = [], marked = store.get('marked', []);

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function say(t) { $('msg').textContent = t; }

$('cid').value = store.get('cid', '');
if (marked.length) $('resume').style.display = 'block';
$('resume').onclick = () => { $('doneTitle').textContent = marked.length + ' marcadas'; renderDone(); };

/* ---------- Auth + Picker ---------- */
function getToken(cid) {
  return new Promise((res, rej) => {
    const c = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: SCOPE,
      callback: r => r.access_token ? res(r.access_token) : rej(new Error(r.error || 'sin token')),
      error_callback: e => rej(new Error(e.type || 'cancelado'))
    });
    c.requestAccessToken();
  });
}
const api = (path, opt = {}) => fetch(API + path, { ...opt, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } })
  .then(async r => { if (!r.ok) throw new Error(r.status + ' ' + await r.text()); return r.json(); });

$('go').onclick = async () => {
  const cid = $('cid').value.trim();
  if (!cid) return say('Pega tu Client ID de Google primero.');
  store.set('cid', cid);
  try {
    say('Conectando…');
    token = await getToken(cid);
    const s = await api('/sessions', { method: 'POST', body: '{}' });
    window.open(s.pickerUri + '/autoclose', '_blank');
    say('Elige las fotos en Google Fotos y toca “Listo”. Vuelve aquí.');
    await poll(s.id);
    items = await loadItems(s.id);
    api('/sessions/' + s.id, { method: 'DELETE' }).catch(() => {});
    if (!items.length) return say('No elegiste fotos.');
    idx = 0; history = []; start();
  } catch (e) { say('Error: ' + e.message); }
};

async function poll(id) {
  for (;;) {
    const s = await api('/sessions/' + id);
    if (s.mediaItemsSet) return;
    await new Promise(r => setTimeout(r, 2000));
  }
}
async function loadItems(sessionId) {
  let out = [], pt = '';
  do {
    const r = await api('/mediaItems?sessionId=' + sessionId + '&pageSize=100' + (pt ? '&pageToken=' + pt : ''));
    out = out.concat(r.mediaItems || []); pt = r.nextPageToken || '';
  } while (pt);
  return out;
}
const imgCache = new Map();
async function imgUrl(it) {
  if (imgCache.has(it.id)) return imgCache.get(it.id);
  const p = fetch(it.mediaFile.baseUrl + '=w1080-h1440', { headers: { Authorization: 'Bearer ' + token } })
    .then(r => r.blob()).then(b => URL.createObjectURL(b)).catch(() => '');
  imgCache.set(it.id, p); return p;
}

/* ---------- Swipe ---------- */
async function makeCard(it, cls) {
  const el = document.createElement('div'); el.className = 'card ' + (cls || '');
  const name = it.mediaFile.filename || '';
  el.innerHTML = '<img alt=""><div class="tag del">BORRAR</div><div class="tag keep">DEJAR</div><div class="name"></div>';
  el.querySelector('.name').textContent = name + (it.type === 'VIDEO' ? '  ▶︎ video' : '');
  imgUrl(it).then(u => el.querySelector('img').src = u);
  return el;
}
async function start() {
  show('s-swipe'); render();
}
async function render() {
  const stage = $('stage'); stage.innerHTML = '';
  $('count').textContent = Math.min(idx + 1, items.length) + ' / ' + items.length;
  $('marked').textContent = marked.length + ' para borrar';
  if (idx >= items.length) { $('doneTitle').textContent = '¡Listo! ' + marked.length + ' marcadas'; return renderDone(); }
  if (items[idx + 1]) { const n = await makeCard(items[idx + 1], 'next'); stage.appendChild(n); }
  const c = await makeCard(items[idx]); stage.appendChild(c); bind(c);
  if (items[idx + 2]) imgUrl(items[idx + 2]);
}
function bind(c) {
  let x0 = 0, dx = 0, drag = false;
  const del = c.querySelector('.tag.del'), keep = c.querySelector('.tag.keep');
  c.onpointerdown = e => { drag = true; x0 = e.clientX; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; };
  c.onpointermove = e => {
    if (!drag) return; dx = e.clientX - x0;
    c.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    del.style.opacity = dx < 0 ? Math.min(1, -dx / 100) : 0;
    keep.style.opacity = dx > 0 ? Math.min(1, dx / 100) : 0;
  };
  c.onpointerup = () => {
    if (!drag) return; drag = false;
    if (dx < -100) decide(true); else if (dx > 100) decide(false);
    else { c.style.transition = 'transform .2s'; c.style.transform = ''; del.style.opacity = keep.style.opacity = 0; }
    dx = 0;
  };
}
function decide(del) {
  const c = $('stage').querySelector('.card:not(.next)'); if (!c || idx >= items.length) return;
  const it = items[idx];
  c.style.transition = 'transform .25s, opacity .25s';
  c.style.transform = `translateX(${del ? -140 : 140}vw) rotate(${del ? -25 : 25}deg)`; c.style.opacity = 0;
  history.push({ id: it.id, del });
  if (del) { marked.push({ id: it.id, name: it.mediaFile.filename, time: it.createTime, type: it.type }); store.set('marked', marked); }
  idx++; setTimeout(render, 220);
}
function undo() {
  const h = history.pop(); if (!h) return;
  idx--; if (h.del) { marked = marked.filter(m => m.id !== h.id); store.set('marked', marked); }
  show('s-swipe'); render();
}
$('bDel').onclick = () => decide(true);
$('bKeep').onclick = () => decide(false);
$('bUndo').onclick = undo;
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') decide(true); else if (e.key === 'ArrowRight') decide(false);
  else if (e.key === 'z') undo();
});

/* ---------- Resultado ---------- */
async function renderDone() {
  show('s-done');
  const g = $('grid'); g.innerHTML = '';
  for (const m of marked) {
    const f = document.createElement('figure');
    const im = document.createElement('img'); const cap = document.createElement('figcaption');
    cap.textContent = m.name || m.id; f.append(im, cap); g.appendChild(f);
    const it = items.find(i => i.id === m.id);
    if (it) imgUrl(it).then(u => im.src = u);
  }
}
$('copy').onclick = async () => {
  const t = marked.map(m => m.name).join('\n');
  try { await navigator.clipboard.writeText(t); $('copy').textContent = 'Copiado ✓'; } catch { prompt('Copia:', t); }
};
$('openPhotos').onclick = () => window.open('https://photos.google.com', '_blank');
$('again').onclick = () => {
  if (confirm('¿Ya borraste las marcadas en Google Fotos? Se limpiará la lista.')) { marked = []; store.set('marked', []); }
  location.reload();
};
</script>
</body>
</html>
